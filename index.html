  <div id="login-alert" class="alert alert-danger py-2 small rounded-3 d-none"></div>

  <div>
    <div class="mb-3">
      <label class="sidebar-label">Username Akun</label>
      <div class="input-group">
        <span class="input-group-text input-group-text-dark border-end-0"><i class="bi bi-person"></i></span>
        <input type="text" id="login-user" class="form-control input-dark border-start-0" placeholder="Username resmi..." required>
      </div>
    </div>

    <!-- PASSWORD DENGAN TOMBOL MATA AKTIF -->
    <div class="mb-3">
      <label class="sidebar-label">Password</label>
      <div class="field-password-wrap">
        <span class="input-group-text input-group-text-dark border-end-0" style="border-radius: 12px 0 0 12px;"><i class="bi bi-key"></i></span>
        <input type="password" id="login-pass" class="form-control input-dark border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="Password akun..." required>
        <button type="button" class="btn-eye-clickable" id="btn-toggle-eye" onclick="aksiToggleMata()" title="Lihat/Sembunyikan Password">
          <i class="bi bi-eye" id="ikon-mata"></i>
        </button>
      </div>
    </div>

    <div class="mb-4">
      <label class="sidebar-label">Kunci Lisensi (License Key)</label>
      <div class="input-group">
        <span class="input-group-text input-group-text-dark border-end-0"><i class="bi bi-patch-check"></i></span>
        <input type="text" id="login-key" class="form-control input-dark border-start-0 font-monospace text-uppercase" placeholder="LIC-XXXX-XXXX" required>
      </div>
    </div>

    <button type="button" id="btn-login-submit" class="btn btn-neon-emerald w-100 py-2.5 justify-content-center shadow-lg" onclick="aksiSubmitLogin()">
      <i class="bi bi-box-arrow-in-right me-1"></i> Verifikasi &amp; Masuk Studio
    </button>
  </div>
  <div class="text-center mt-3">
    <small class="text-secondary" style="font-size: 0.72rem;">&copy; 2026 Studio Kartu Ujian Pro &bull; Cloud License Active</small>
  </div>
</div>


  <div class="sidebar-content">
    <div class="section-title"><i class="bi bi-diagram-3-fill text-success"></i> Jenjang &amp; Peserta</div>
    <div class="sidebar-group">
      <div class="mb-2">
        <label class="sidebar-label">Tingkat Jenjang</label>
        <select id="pilih-jenjang" class="form-select select-dark" onchange="gantiJenjang(this.value)">
          <option value="MI" selected>Madrasah Ibtidaiyah (MI)</option>
          <option value="SD">Sekolah Dasar (SD)</option>
          <option value="MTS">Madrasah Tsanawiyah (MTs)</option>
          <option value="SMP">Sekolah Menengah Pertama (SMP)</option>
          <option value="MA">Madrasah Aliyah (MA)</option>
          <option value="SMA">SMA / SMK</option>
        </select>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="sidebar-label">Pilih Kelas</label>
          <select id="filter-kelas" class="form-select select-dark" onchange="filterSiswa()"></select>
        </div>
        <div class="col-6">
          <label class="sidebar-label">Ruang Ujian</label>
          <select id="pilih-ruang" class="form-select select-dark" onchange="renderSemuaKartu()">
            <option value="">(Tanpa Ruang)</option>
            <option value="Ruang 01">Ruang 01</option>
            <option value="Ruang 02">Ruang 02</option>
            <option value="Ruang 03">Ruang 03</option>
            <option value="Ruang 04">Ruang 04</option>
            <option value="Ruang 05">Ruang 05</option>
            <option value="Ruang 06">Ruang 06</option>
          </select>
        </div>
      </div>

      <div>
        <label class="sidebar-label">Cetak Satuan</label>
        <div class="input-group input-group-sm">
          <select id="filter-siswa" class="form-select select-dark" onchange="renderSemuaKartu()">
            <option value="">-- Semua Siswa --</option>
          </select>
          <button class="btn btn-dark-outline" type="button" onclick="resetPilihSiswa()"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
    </div>

    <div class="section-title"><i class="bi bi-aspect-ratio-fill text-info"></i> Format &amp; Tema</div>
    <div class="sidebar-group">
      <div class="mb-2">
        <label class="sidebar-label">Ukuran Mika ID Card</label>
        <select id="pilih-ukuran-mika" class="form-select select-dark" onchange="renderSemuaKartu()">
          <option value="preset-b1" data-kapasitas="10">Mika B1 (10 Kartu / A4)</option>
          <option value="preset-b2" data-kapasitas="8">Mika B2 (8 Kartu / A4)</option>
          <option value="preset-b3" data-kapasitas="6" selected>Mika B3 (6 Kartu / A4) [Best]</option>
          <option value="preset-b4" data-kapasitas="3">Mika B4 (3 Kartu / A4 - Jumbo)</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="sidebar-label">Judul Kartu Ujian</label>
        <select id="pilih-jenis-kartu" class="form-select select-dark" onchange="gantiJenisKartu()">
          <option value="KARTU PESERTA ASESMEN SUMATIF AKHIR SEMESTER (SAS) GANJIL">Asesmen Sumatif Ganjil</option>
          <option value="KARTU PESERTA ASESMEN SUMATIF AKHIR SEMESTER (SAS) GENAP">Asesmen Sumatif Genap</option>
          <option value="KARTU PESERTA ASESMEN AKHIR JENJANG T.P. 2025/2026" selected>Asesmen Akhir Jenjang</option>
          <option value="KARTU PESERTA TRY OUT UJIAN AKHIR">Try Out Ujian Akhir</option>
          <option value="KUSTOM">Tulis Judul Kustom...</option>
        </select>
        <div class="d-none mt-2" id="wrap-judul-kustom">
          <input type="text" id="input-judul-kustom" class="form-control input-panel-dark form-control-sm" placeholder="Ketik Judul Sendiri..." oninput="updateJudulKartuLangsung()">
        </div>
      </div>

      <div class="mb-2">
        <label class="sidebar-label">Sakelar Token</label>
        <select id="opsi-token" class="form-select select-dark" onchange="gantiOpsiToken(this.value)">
          <option value="sembunyi" selected>Sembunyikan Token</option>
          <option value="dari_data">Dari Data Excel</option>
          <option value="seragam">1 Token Seragam</option>
        </select>
        <input type="text" id="inp-token-seragam" class="form-control input-panel-dark form-control-sm font-monospace d-none mt-1" placeholder="Token Seragam..." oninput="updateTokenLangsung()">
      </div>

      <div>
        <label class="sidebar-label">Warna Aksen Kartu</label>
        <div class="d-flex align-items-center gap-2">
          <input type="color" id="tema-warna-picker" class="form-control form-control-color input-panel-dark w-25 p-1" value="#059669" onchange="ubahWarnaTema(this.value)">
          <select class="form-select select-dark w-75" onchange="ubahWarnaTema(this.value)">
            <option value="#059669">Hijau Zamrud</option>
            <option value="#0284c7">Biru Safir</option>
            <option value="#b91c1c">Merah Marun</option>
            <option value="#4338ca">Indigo Modern</option>
            <option value="#334155">Dark Slate</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-title"><i class="bi bi-pen-fill text-warning"></i> Legalitas &amp; Pejabat</div>
    <div class="sidebar-group">
      <div class="mb-2">
        <label class="sidebar-label">Titimangsa (Tempat, Tgl)</label>
        <select id="select-titimangsa" class="form-select select-dark" onchange="ubahTitimangsa(this.value)">
          <option value="Kota / Kab, ....................">Kota / Kab, ....................</option>
          <option value="KUSTOM">Ketik Sendiri...</option>
        </select>
        <input type="text" id="inp-titimangsa-kustom" class="form-control input-panel-dark form-control-sm d-none mt-1" placeholder="Ponorogo, 10 Mei 2026" oninput="updateFooterTtdLangsung()">
      </div>

      <div class="mb-2">
        <label class="sidebar-label" id="lbl-pejabat">Kepala Madrasah</label>
        <select id="select-kamad" class="form-select select-dark" onchange="ubahKamad(this.value)">
          <option value="titik">...................................... (Titik-titik)</option>
          <option value="KUSTOM">Ketik Nama Kepala...</option>
        </select>
        <input type="text" id="inp-kamad-nama" class="form-control input-panel-dark form-control-sm d-none mt-1" placeholder="Nama & Gelar Pejabat" oninput="updateFooterTtdLangsung()">
      </div>

      <div>
        <label class="sidebar-label">NIP Pejabat</label>
        <select id="select-nip" class="form-select select-dark" onchange="ubahNip(this.value)">
          <option value="sembunyi">Tanpa NIP</option>
          <option value="titik">NIP. ..................................</option>
          <option value="KUSTOM">Ketik NIP Sendiri...</option>
        </select>
        <input type="text" id="inp-kamad-nip" class="form-control input-panel-dark form-control-sm d-none mt-1" placeholder="19800101 200501 1 001" oninput="updateFooterTtdLangsung()">
      </div>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button class="btn btn-dark-outline justify-content-center" data-bs-toggle="modal" data-bs-target="#modalLembaga">
        <i class="bi bi-building-gear text-primary"></i> Edit Kop Lembaga
      </button>
      <button class="btn btn-dark-outline justify-content-center" data-bs-toggle="modal" data-bs-target="#modalUploadExcel">
        <i class="bi bi-file-earmark-spreadsheet text-success"></i> Impor Excel Siswa
      </button>
      <button class="btn btn-dark-outline justify-content-center" data-bs-toggle="modal" data-bs-target="#modalMedia">
        <i class="bi bi-images text-warning"></i> Upload Logo, Foto &amp; TTD
      </button>
    </div>
  </div>
</aside>

        <i class="bi bi-layout-sidebar-inset"></i>

          <span id="badge-expiry-countdown" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill" style="font-size: 0.68rem;">

          </span>
